<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main>
        <div id="calculator-container">
            <!--
                Calculator Display Area
                ========================
                This section will contain the calculator's display screen
                where user input and calculation results are shown.
                Future stories will add:
                - An output display element showing the current value/result
                - Potentially a secondary display for the running calculation
            -->
            <div id="display-area">
                <!-- Display output element will be added here -->
            </div>

            <!--
                Calculator Button Area
                ======================
                This section will contain the calculator's interactive buttons.
                Future stories will add buttons for:
                - Digits: 0-9
                - Operations: + (add), - (subtract), * (multiply), / (divide)
                - Equals: = (calculate result)
                - Clear: C (reset calculator)
                - Decimal point: .
            -->
            <div id="button-area">
                <!-- Calculator buttons will be added here -->
            </div>
        </div>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
